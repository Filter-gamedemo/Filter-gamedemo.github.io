<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3eee4">
  <meta name="description" content="filter game.">
  <link rel="icon" href="data:,">
  <title>Game Demo — Selfie Camera</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3eee4;
      --paper-deep: #e9e1d3;
      --ink: #202c2a;
      --muted: #687572;
      --line: #c9c9b9;
      --mint: #c3e7d7;
      --mint-deep: #327a62;
      --coral: #f17658;
      --yellow: #f3d46f;
      --white: #fbfaf5;
      --display: "Trebuchet MS", "Avenir Next", sans-serif;
      --body: "Avenir Next", "Segoe UI", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 8% 4%, rgba(243,212,111,.18), transparent 26rem),
        var(--paper);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid #327a62; outline-offset: 3px; }
    .shell { width: min(1200px, calc(100% - 64px)); margin: 0 auto; }
    .topbar {
      height: 82px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(32,44,42,.15);
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .brand-mark {
      width: 39px; height: 32px; border: 2px solid var(--ink); border-radius: 9px;
      position: relative; display: grid; place-items: center; background: var(--yellow);
      box-shadow: 3px 3px 0 var(--ink); transform: rotate(-3deg);
    }
    .brand-mark::before { content: ""; position: absolute; width: 14px; height: 6px; border: 2px solid var(--ink); border-bottom: 0; border-radius: 4px 4px 0 0; top: -7px; left: 5px; }
    .brand-mark::after { content: ""; width: 12px; height: 12px; border: 2px solid var(--ink); border-radius: 50%; background: var(--mint); }
    .brand-name { font: 700 14px var(--display); letter-spacing: -.03em; }
    .brand-name span { display: block; font: 500 10px var(--mono); letter-spacing: .11em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
    .top-note { font: 11px var(--mono); color: var(--muted); letter-spacing: .07em; text-transform: uppercase; }
    main { padding: 49px 0 38px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 32px; }
    .eyebrow { display: flex; align-items: center; gap: 8px; margin: 0 0 11px; font: 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mint-deep); }
    .eyebrow::before { content: ""; width: 21px; height: 2px; background: var(--coral); }
    h1 { margin: 0; font: 700 clamp(36px, 5vw, 61px)/.98 var(--display); letter-spacing: -.075em; }
    h1 em { color: var(--coral); font-style: normal; }
    .intro-copy { max-width: 255px; margin: 0 0 4px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .workbench { display: grid; grid-template-columns: minmax(315px, .78fr) minmax(0, 1.22fr); gap: 24px; align-items: stretch; }
    .panel {
      border: 1px solid var(--line); border-radius: 16px; background: rgba(251,250,245,.78);
      box-shadow: 0 5px 0 rgba(32,44,42,.08);
    }
    .setup { padding: 25px 24px 20px; display: flex; flex-direction: column; }
    .section-head { display: flex; align-items: center; gap: 11px; margin-bottom: 25px; }
    .step {
      width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%;
      background: var(--mint); color: var(--ink); font: 12px var(--mono);
    }
    .section-head h2 { margin: 0; font: 700 17px var(--display); letter-spacing: -.04em; }
    .fixed-destination {
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; padding: 14px;
      border: 1px solid #cbd9cf; border-radius: 9px; background: #edf4ec;
    }
    .fixed-destination-label { color: var(--mint-deep); font: 10px var(--mono); letter-spacing: .1em; }
    .fixed-destination strong { font-size: 13px; }
    .fixed-destination > span:last-child { color: var(--muted); font-size: 11px; line-height: 1.5; }
    .notice {
      display: flex; gap: 11px; padding: 13px 13px 12px; border-radius: 9px;
      background: #f7edc9; border: 1px solid #eadb9e; margin-bottom: 22px;
    }
    .notice-icon { flex: 0 0 19px; height: 19px; display: grid; place-items: center; border: 1.5px solid var(--ink); border-radius: 50%; font: 700 11px var(--mono); }
    .notice p { margin: 0; font-size: 11px; line-height: 1.55; }
    .notice strong { display: block; margin-bottom: 2px; font-size: 11px; }
    .actions { display: flex; gap: 10px; }
    .button {
      min-height: 47px; padding: 0 17px; display: inline-flex; justify-content: center; align-items: center; gap: 10px;
      border: 1.5px solid var(--ink); border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 12px;
      transition: transform .15s ease, background-color .15s ease, box-shadow .15s ease;
    }
    .button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 0 var(--ink); }
    .button:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
    .button:disabled { cursor: not-allowed; opacity: .48; }
    .start { flex: 1; background: var(--mint); color: var(--ink); }
    .start:hover:not(:disabled) { background: #b1ddc9; }
    .stop { min-width: 104px; background: var(--coral); color: #271b17; }
    .button-icon { width: 11px; height: 11px; display: inline-block; }
    .play-icon { border-left: 11px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
    .stop-icon { background: currentColor; border-radius: 2px; }
    .footnote { margin: auto 0 0; padding-top: 20px; color: var(--muted); font-size: 10px; line-height: 1.65; }
    .footnote b { color: var(--ink); }
    .preview-panel { padding: 13px; background: #263532; border-color: #263532; color: var(--white); overflow: hidden; display: flex; flex-direction: column; }
    .preview-top {
      min-height: 42px; padding: 0 5px 11px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .preview-title { display: flex; align-items: center; gap: 9px; font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #84918c; }
    .is-active .live-dot { background: #ff795b; animation: pulse 1.4s ease-in-out infinite; }
    .destination { overflow: hidden; max-width: 52%; text-overflow: ellipsis; white-space: nowrap; color: #d2ded7; font: 10px var(--mono); text-align: right; }
    .viewfinder {
      position: relative; width: 100%; min-height: 270px; flex: 1; overflow: hidden; border-radius: 9px;
      background:
        linear-gradient(rgba(203,234,218,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(203,234,218,.06) 1px, transparent 1px),
        #40544d;
      background-size: 33.333% 33.333%;
      border: 1px solid rgba(228,243,233,.19);
    }
    #camera { display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .viewfinder.has-video #camera { display: block; }
    .viewfinder.has-video .idle-scene { display: none; }
    .idle-scene { position: absolute; inset: 0; overflow: hidden; }
    .scene-sun { position: absolute; width: 85px; height: 85px; right: 17%; top: 15%; border-radius: 50%; background: var(--yellow); opacity: .95; }
    .scene-hill { position: absolute; width: 115%; height: 54%; left: -8%; bottom: -20%; border-radius: 50% 50% 0 0; background: #83aa91; transform: rotate(-6deg); }
    .scene-hill.back { width: 87%; height: 39%; bottom: 3%; left: -14%; background: #a0c8a8; transform: rotate(9deg); }
    .scene-spark { position: absolute; z-index: 1; color: #f7f1de; font: 15px var(--mono); }
    .spark-a { top: 28%; left: 23%; } .spark-b { top: 47%; right: 31%; font-size: 10px; }
    .aim {
      position: absolute; left: 50%; top: 49%; width: 54px; height: 54px; z-index: 2;
      transform: translate(-50%,-50%); opacity: .62;
    }
    .aim::before, .aim::after { content: ""; position: absolute; background: rgba(255,255,255,.8); }
    .aim::before { width: 1px; height: 100%; left: 50%; }
    .aim::after { height: 1px; width: 100%; top: 50%; }
    .corner { position: absolute; z-index: 3; width: 19px; height: 19px; border-color: rgba(248,250,235,.72); border-style: solid; }
    .c1 { left: 15px; top: 15px; border-width: 1px 0 0 1px; }
    .c2 { right: 15px; top: 15px; border-width: 1px 1px 0 0; }
    .c3 { left: 15px; bottom: 15px; border-width: 0 0 1px 1px; }
    .c4 { right: 15px; bottom: 15px; border-width: 0 1px 1px 0; }
    .camera-caption {
      position: absolute; left: 20px; bottom: 18px; z-index: 4; display: flex; align-items: center; gap: 7px;
      color: #f5f6eb; font: 9px var(--mono); letter-spacing: .1em; text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0,0,0,.4);
    }
    .camera-caption::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); }
    .send-bar { display: grid; grid-template-columns: 1fr 1fr 1.45fr; gap: 8px; padding: 12px 3px 2px; }
    .readout { min-width: 0; padding: 9px 10px; border-radius: 6px; background: rgba(248,250,235,.07); }
    .readout-label { display: block; margin-bottom: 6px; color: #a7b8ae; font: 9px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    .readout-value { display: block; overflow: hidden; color: #f4f5e9; font: 12px var(--mono); white-space: nowrap; text-overflow: ellipsis; }
    .readout-value.good { color: #9ce0b7; } .readout-value.bad { color: #ff9b83; }
    .message {
      display: none; margin-top: 15px; padding: 11px 13px; border-radius: 8px; font-size: 11px; line-height: 1.55;
    }
    .message.visible { display: block; }
    .message.error { color: #7e2e1e; background: #f9ddd3; border: 1px solid #efb9a9; }
    .message.info { color: #315b4c; background: #dff0e5; border: 1px solid #bbdfc8; }
    .message strong { display: block; margin-bottom: 2px; }
    .privacy-strip { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 22px; padding: 13px 2px 0; border-top: 1px solid rgba(32,44,42,.15); color: var(--muted); font-size: 10px; }
    .privacy-strip span:first-child { color: var(--ink); font-weight: 700; }
    .privacy-strip .lock { font: 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
    @keyframes pulse { 50% { opacity: .38; } }
    @media (min-height: 760px) {
      main { padding-top: 62px; }
      .viewfinder { min-height: 340px; }
      .setup { padding: 29px 27px 23px; }
    }
    @media (max-width: 760px) {
      .shell { width: min(100% - 36px, 560px); }
      .topbar { height: 68px; }
      .top-note { font-size: 9px; }
      main { padding: 36px 0 25px; }
      .intro { display: block; margin-bottom: 24px; }
      h1 { font-size: clamp(42px, 11vw, 56px); }
      .intro-copy { max-width: 350px; margin-top: 12px; font-size: 12px; }
      .workbench { grid-template-columns: 1fr; gap: 15px; }
      .setup { padding: 21px 19px 19px; }
      .footnote { margin-top: 19px; }
      .preview-panel { min-height: 390px; }
      .viewfinder { min-height: 290px; }
      .privacy-strip { align-items: flex-start; flex-direction: column; gap: 7px; }
    }
    @media (max-width: 390px) {
      .shell { width: calc(100% - 28px); }
      .top-note { max-width: 118px; text-align: right; line-height: 1.5; }
      .send-bar { grid-template-columns: .8fr .8fr 1.4fr; gap: 5px; }
      .readout { padding: 8px 7px; }
      .readout-label { font-size: 8px; }
      .readout-value { font-size: 10px; }
      .destination { max-width: 56%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
    body {
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101412;
      color: #f4f2e9;
      font-family: var(--body);
    }
    .shell { width: min(820px, 100%); margin: 0; }
    .topbar { display: none; }
    main { padding: 0; }
    .camera-app { display: grid; gap: 14px; }
    .camera-heading { margin: 0; text-align: center; font: 700 clamp(22px, 4vw, 30px)/1.1 var(--display); letter-spacing: -.04em; }
    .camera-subtitle { margin: 0; color: #b7c0b9; text-align: center; font-size: 12px; line-height: 1.5; }
    .preview-panel { padding: 10px; background: #202723; border: 1px solid #39423d; border-radius: 18px; box-shadow: none; }
    .preview-top { min-height: 34px; padding: 0 7px 9px; }
    .preview-title { color: #e6eee8; }
    .destination { display: none; }
    .viewfinder {
      width: 100%;
      height: min(66svh, 610px);
      min-height: 280px;
      flex: none;
      aspect-ratio: 4 / 3;
      border-radius: 11px;
      background: #111613;
    }
    #camera { transform: scaleX(-1); }
    .idle-scene { display: none; }
    .aim { opacity: .25; }
    .camera-caption {
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      background: rgba(16,20,18,.72);
      color: #fff;
      font: 11px var(--body);
      letter-spacing: 0;
      text-transform: none;
      white-space: nowrap;
    }
    .camera-caption::before { display: none; }
    .send-bar { display: flex; justify-content: center; padding: 8px 3px 2px; }
    .readout:nth-child(-n+2) { display: none; }
    .readout { padding: 2px 8px; background: transparent; text-align: center; }
    .readout-label { display: none; }
    .readout-value { color: #c4d1c8; font-size: 11px; }
    .readout-value.good { color: #9ce0b7; }
    .readout-value.bad { color: #ff9b83; }
    .message { margin: 0; text-align: center; color: #d5ded8; background: transparent; border: 0; padding: 2px 8px 0; font-size: 11px; }
    .message.error {
      padding: 10px 12px;
      border: 1px solid rgba(255, 155, 131, .35);
      border-radius: 10px;
      background: rgba(90, 26, 18, .45);
      color: #ffd2c8;
    }
    .message.info { display: none; }
    .message strong { display: inline; margin-right: 5px; }
    @media (max-width: 700px) {
      body { padding: 14px; }
      .camera-app { gap: 11px; }
      .preview-panel { padding: 8px; }
      .viewfinder { height: min(64svh, 620px); min-height: 300px; aspect-ratio: 4 / 5; }
      .camera-caption { bottom: 14px; }
    }
    @media (max-height: 640px) and (min-width: 701px) {
      body { padding: 10px; }
      .camera-app { gap: 7px; }
      .viewfinder { height: min(58svh, 480px); min-height: 230px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" aria-label="Game Demo">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Game Demo<span>Selfie camera</span></span>
      </div>
      <div class="top-note">One camera. One fixed destination.</div>
    </header>

    <main class="camera-app" aria-labelledby="page-title">
      <h1 class="camera-heading" id="page-title">Launch Filter</h1>
      <p class="camera-subtitle">face filter game</p>
      <section class="panel preview-panel" id="preview-panel" aria-label="Game Demo camera">
        <div class="preview-top">
          <div class="preview-title"><span class="live-dot" aria-hidden="true"></span><span id="live-label">Camera off</span></div>
        </div>
        <div class="viewfinder" id="viewfinder">
          <video id="camera" autoplay muted playsinline aria-label="Live selfie camera preview"></video>
          <div class="idle-scene" aria-hidden="true"></div>
          <span class="aim" aria-hidden="true"></span>
          <span class="corner c1" aria-hidden="true"></span><span class="corner c2" aria-hidden="true"></span>
          <span class="corner c3" aria-hidden="true"></span><span class="corner c4" aria-hidden="true"></span>
          <span class="camera-caption" id="camera-caption">Show face to put filter</span>
        </div>
        <div class="send-bar" aria-label="Camera status">
          <div class="readout"><span class="readout-label">Frames sent</span><span id="frame-count" class="readout-value">0</span></div>
          <div class="readout"><span class="readout-label">Last send</span><span id="last-send" class="readout-value">—</span></div>
          <div class="readout"><span class="readout-label">Status</span><span id="send-status" class="readout-value">Camera off</span></div>
        </div>
      </section>
      <div id="feedback" class="message" role="status" aria-live="polite"></div>
    </main>
  </div>

  <script>
    (() => {
      "use strict";

      const previewPanel = document.getElementById("preview-panel");
      const viewfinder = document.getElementById("viewfinder");
      const camera = document.getElementById("camera");
      const liveLabel = document.getElementById("live-label");
      const cameraCaption = document.getElementById("camera-caption");
      const frameCount = document.getElementById("frame-count");
      const lastSend = document.getElementById("last-send");
      const sendStatus = document.getElementById("send-status");
      const feedback = document.getElementById("feedback");
      let stream = null;
      let timer = null;
      let controller = null;
      let active = false;
      let busy = false;
      let sequence = 0;
      let successfulFrames = 0;
      let lastCaptureAt = 0;
      let sessionId = 0;

      function showMessage(kind, title, detail) {
        feedback.className = "message visible " + kind;
        feedback.replaceChildren();
        const strong = document.createElement("strong");
        strong.textContent = title;
        feedback.append(strong, document.createTextNode(detail));
      }

      function clearMessage() {
        feedback.className = "message";
        feedback.textContent = "";
      }

      function releaseCamera() {
        if (stream) {
          stream.getTracks().forEach((track) => {
            track.onended = null;
            track.stop();
          });
          stream = null;
        }
        camera.srcObject = null;
        viewfinder.classList.remove("has-video");
      }

      function stopSession() {
        sessionId += 1;
        active = false;
        busy = false;
        if (timer !== null) {
          clearTimeout(timer);
          timer = null;
        }
        if (controller) {
          controller.abort();
          controller = null;
        }
        releaseCamera();
        previewPanel.classList.remove("is-active");
        liveLabel.textContent = "Camera off";
        cameraCaption.textContent = "Show face to put filter";
        if (sendStatus.textContent !== "Failed") {
          sendStatus.textContent = "Stopped";
          sendStatus.className = "readout-value";
        }
      }

      function setError(title, detail) {
        sendStatus.textContent = "Failed";
        sendStatus.className = "readout-value bad";
        lastSend.textContent = "Error";
        showMessage("error", title, detail);
      }

      function scheduleNext(id) {
        if (!active || id !== sessionId) return;
        const delay = Math.max(0, 1000 - (performance.now() - lastCaptureAt));
        timer = setTimeout(() => captureAndSend(id), delay);
      }

      async function captureAndSend(id) {
        if (!active || id !== sessionId || busy) return;
        if (!camera.videoWidth || !camera.videoHeight) {
          timer = setTimeout(() => captureAndSend(id), 120);
          return;
        }
        busy = true;
        lastCaptureAt = performance.now();
        sequence += 1;
        const capturedAt = new Date().toISOString();
        let image;
        let width = 0;
        let height = 0;
        try {
          const canvas = document.createElement("canvas");
          const scale = Math.min(1, 640 / camera.videoWidth, 480 / camera.videoHeight);
          canvas.width = Math.max(1, Math.round(camera.videoWidth * scale));
          canvas.height = Math.max(1, Math.round(camera.videoHeight * scale));
          const context = canvas.getContext("2d");
          if (!context) throw new Error("Canvas is unavailable");
          context.drawImage(camera, 0, 0, canvas.width, canvas.height);
          width = canvas.width;
          height = canvas.height;
          image = canvas.toDataURL("image/jpeg", 0.72);
        } catch (_) {
          busy = false;
          setError("Could not capture a frame", "The browser could not read the camera image. Refresh this page to try again.");
          stopSession();
          return;
        }
        const requestController = new AbortController();
        controller = requestController;
        sendStatus.textContent = "Working…";
        sendStatus.className = "readout-value";
        lastSend.textContent = "In progress";
        try {
          const response = await fetch("/api/game-demo/frame", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              image,
              contentType: "image/jpeg",
              capturedAt,
              width,
              height,
              sequence
            }),
            signal: requestController.signal
          });
          if (!active || id !== sessionId) return;
          if (!response.ok) {
            let failure = null;
            try { failure = await response.json(); } catch (_) {}
            const detail = failure && typeof failure.error === "string"
              ? failure.error
              : "The fixed destination did not accept this frame.";
            const destinationStatus = failure && Number.isInteger(failure.destinationStatus)
              ? " (destination HTTP " + failure.destinationStatus + ")"
              : "";
            setError("Game Demo delivery failed", detail + destinationStatus + " No further photos will be sent.");
            stopSession();
          } else {
            successfulFrames += 1;
            frameCount.textContent = String(successfulFrames);
            lastSend.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
            sendStatus.textContent = "Delivered";
            sendStatus.className = "readout-value good";
            clearMessage();
          }
        } catch (error) {
          if (!active || id !== sessionId || error.name === "AbortError") return;
          setError("Game Demo relay is unavailable", "The frame could not reach Discord. Refresh this page to try again.");
          stopSession();
        } finally {
          if (controller === requestController) controller = null;
          if (id === sessionId) {
            busy = false;
            scheduleNext(id);
          }
        }
      }

      async function startSession() {
        clearMessage();
        if (!window.isSecureContext) {
          showMessage("error", "Secure connection required", "Camera access only works on HTTPS or localhost. Open this page in a secure context before starting.");
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showMessage("error", "Camera access is unavailable", "This browser does not provide camera access here. Try a current browser on HTTPS or localhost.");
          return;
        }

        const currentSession = ++sessionId;
        active = true;
        successfulFrames = 0;
        sequence = 0;
        frameCount.textContent = "0";
        lastSend.textContent = "—";
        sendStatus.textContent = "Connecting…";
        sendStatus.className = "readout-value";
        liveLabel.textContent = "Connecting to selfie camera";
        cameraCaption.textContent = "Show face to put filter";
        previewPanel.classList.add("is-active");

        try {
          const acquired = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode: { ideal: "user" } }
          });
          if (!active || currentSession !== sessionId) {
            acquired.getTracks().forEach((track) => track.stop());
            return;
          }
          stream = acquired;
          const videoTrack = stream.getVideoTracks()[0];
          if (videoTrack) {
            videoTrack.onended = () => {
              if (currentSession === sessionId && active) {
                setError("Camera disconnected", "The camera track ended. No further photos will be sent.");
                stopSession();
              }
            };
          }
          camera.srcObject = stream;
          await camera.play();
          if (!active || currentSession !== sessionId) return;
          viewfinder.classList.add("has-video");
          liveLabel.textContent = "Live";
          cameraCaption.textContent = "Show face to put filter";
          sendStatus.textContent = "Ready";
          captureAndSend(currentSession);
        } catch (error) {
          if (currentSession !== sessionId || !active) return;
          const permissionError = error && (error.name === "NotAllowedError" || error.name === "PermissionDeniedError");
          releaseCamera();
          active = false;
          previewPanel.classList.remove("is-active");
          liveLabel.textContent = "Camera off";
          cameraCaption.textContent = "Show face to put filter";
          sendStatus.textContent = "Camera off";
          sendStatus.className = "readout-value";
          showMessage("error", permissionError ? "Camera permission was not granted" : "Could not start the camera", permissionError
            ? "Allow camera access in your browser settings, then refresh this page. No image was sent."
            : "The camera could not be opened or played. Check that it is connected and refresh this page. No image was sent.");
        }
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden && active) stopSession();
      });
      window.addEventListener("pagehide", () => {
        if (active) stopSession();
      });
      window.addEventListener("beforeunload", () => {
        if (active) stopSession();
      });

      if (!document.hidden) {
        startSession();
      } else {
        const startWhenVisible = () => {
          if (document.hidden) return;
          document.removeEventListener("visibilitychange", startWhenVisible);
          startSession();
        };
        document.addEventListener("visibilitychange", startWhenVisible);
      }
    })();
  </script>
</body>
</html>
